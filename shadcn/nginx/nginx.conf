# nginx serving the Vite build of the shadcn page: one worker for --cpus 1, static files only.
user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# Below --ulimit nofile.
worker_rlimit_nofile 16384;
# Below --stop-timeout.
worker_shutdown_timeout 10s;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  reset_timedout_connection on;
  # Static site: no request carries a body.
  client_max_body_size 1k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml;

  # Descriptors of the few dist files stay open; sized far below the 64m container.
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_errors on;

  include /etc/nginx/conf.d/*.conf;
}
